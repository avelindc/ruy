name = "breakout-music-api-v2"
main = "src/index.ts"
compatibility_date = "2026-10-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
ENVIRONMENT = "production"
CORS_ALLOWED_ORIGINS = "https://ruy-771.pages.dev"

[[r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "breakout-music-storage"
preview_bucket_name = "breakout-music-storage-dev"

[env.development]
name = "breakout-music-api-v2-dev"

[env.development.vars]
ENVIRONMENT = "development"
CORS_ALLOWED_ORIGINS = "http://localhost:5173"

[[env.development.r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "breakout-music-storage-dev"
